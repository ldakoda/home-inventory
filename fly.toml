app = "home-inventory-ldakoda"
primary_region = "sea"

[build]

[env]
  DATABASE_URL = "sqlite:////data/inventory.db"
  IMAGE_DIR = "/data/uploaded_images"

[mounts]
  source = "home_inventory_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
