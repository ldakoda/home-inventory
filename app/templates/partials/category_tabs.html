<div id="category-tabs" class="tabs" {% if oob %}hx-swap-oob="true"{% endif %}>
  <button type="button" class="tab {{ 'active' if active_category == 'all' or not active_category else '' }}" data-slug="all" onclick="selectCategory('all')">🌐 All <span class="tab-count" id="tab-count-all">{{ category_counts.values() | sum }}</span></button>
  {% for c in categories %}
  <button type="button" class="tab {{ 'active' if active_category == c.slug else '' }}" data-slug="{{ c.slug }}" onclick="selectCategory('{{ c.slug }}')">{{ c.icon }} {{ c.name }} <span class="tab-count" id="tab-count-{{ c.slug }}">{{ category_counts.get(c.slug, 0) }}</span></button>
  {% endfor %}
  <button type="button" class="tab tab-add" hx-get="/categories/new" hx-target="#category-form-slot" hx-swap="innerHTML">➕ Add Category</button>
</div>
