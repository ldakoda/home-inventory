<div id="item-{{ item.id }}" class="item-row" data-category="{{ item.category.slug }}" data-category-name="{{ item.category.name }}"
  {% for field in item.category.fields %}{% if field != item.category.primary_field %}data-field-{{ field | lower | replace(' ', '-') }}="{{ item.attributes.get(field, '') }}" {% endif %}{% endfor %}>
  <div class="item-thumb item-clickable" hx-get="/items/{{ item.id }}/view" hx-target="#modal-slot" hx-swap="innerHTML">
    {% if item.image_path %}
    <img src="{{ item.image_path }}" loading="lazy" alt="">
    {% else %}
    <span class="emoji">{{ item.category.icon }}</span>
    {% endif %}
  </div>
  <div class="item-main item-clickable" hx-get="/items/{{ item.id }}/view" hx-target="#modal-slot" hx-swap="innerHTML">
    <div class="item-col item-col-name">
      <div class="item-name">{{ item.name }}</div>
    </div>
    <div class="item-col item-col-category">{{ item.category.icon }} {{ item.category.name }}</div>
    <div class="item-extra-cols"></div>
  </div>
  <div class="item-actions">
    <button class="btn-plain" hx-get="/items/{{ item.id }}/edit" hx-target="#item-{{ item.id }}" hx-swap="outerHTML" title="Edit" aria-label="Edit">✏️</button>
  </div>
</div>
