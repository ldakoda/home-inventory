<div class="panel">
  <h3>➕ Add New Item</h3>
  <form hx-post="/items" hx-target="#add-item-slot" hx-swap="innerHTML" hx-encoding="multipart/form-data">
    <label>Category</label>
    <select name="category_slug" onchange="
      htmx.ajax('GET', '/categories/'+this.value+'/fields', {target: '#dynamic-fields', swap: 'innerHTML'});
      htmx.ajax('GET', '/categories/'+this.value+'/new-lookup-panel', {target: '#new-item-lookup-panel', swap: 'innerHTML'});
    ">
      {% for c in categories %}
      <option value="{{ c.slug }}" {{ 'selected' if c.slug == category.slug else '' }}>{{ c.icon }} {{ c.name }}</option>
      {% endfor %}
    </select>

    <div id="dynamic-fields">
      {% include "partials/field_inputs.html" %}
    </div>

    <div id="new-item-lookup-panel">
      {% include "partials/new_item_lookup_panel.html" %}
    </div>

    <label>Photo URL</label>
    <input type="text" name="image_url">
    <label>Or upload an image file</label>
    <div class="photo-upload-row">
      <input type="file" id="new-item-image-file" name="image_file" accept="image/*" class="visually-hidden"
        onchange="document.getElementById('new-item-image-file-name').textContent = this.files[0] ? this.files[0].name : 'No file chosen';">
      <button type="button" class="btn-plain"
        onclick="const el = document.getElementById('new-item-image-file'); el.removeAttribute('capture'); el.click();">📁 Choose File</button>
      <button type="button" class="btn-plain camera-btn"
        onclick="const el = document.getElementById('new-item-image-file'); el.setAttribute('capture', 'environment'); el.click();">📷 Take Picture</button>
      <span id="new-item-image-file-name" class="file-name-label">No file chosen</span>
    </div>

    <div class="edit-actions">
      <button type="submit" class="btn-primary">💾 Save</button>
      <button type="button" class="btn-plain" onclick="document.getElementById('add-item-slot').innerHTML=''">Cancel</button>
    </div>
  </form>
</div>
