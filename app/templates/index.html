{% extends "base.html" %}
{% block content %}
<div id="toolbar">
  <div class="toolbar-row">
    <h2>🏠 Home Inventory</h2>
    <form action="/logout" method="post" class="logout-form"><button class="btn-plain">🚪 Log Out</button></form>
  </div>

  <input type="search" id="search-q" name="q" placeholder="🔍 Search inventory..."
         hx-get="/items" hx-target="#items-list" hx-swap="innerHTML"
         hx-trigger="keyup changed delay:300ms, search-now" hx-include="#category-filter">
  <input type="hidden" id="category-filter" name="category" value="all">

  {% include "partials/category_tabs.html" %}
  <div id="category-form-slot"></div>

  <div id="missing-metadata-banner"></div>
  <div id="missing-metadata-panel-slot"></div>

  <button class="btn-primary" hx-get="/items/new" hx-target="#add-item-slot" hx-swap="innerHTML">➕ Add Item</button>
  <div id="add-item-slot"></div>

  <div class="view-toggle">
    <button type="button" id="view-list-btn" class="btn-plain" onclick="setViewMode('list')">☰ Details</button>
    <button type="button" id="view-grid-btn" class="btn-plain" onclick="setViewMode('grid')">🔳 Icons</button>
    <button type="button" class="btn-plain" onclick="openViewOptions()">⚙️ Details &amp; Sort</button>
  </div>
</div>

<div id="list-header"></div>
<div id="items-list" hx-trigger="refreshList from:body" hx-get="/items" hx-include="#search-q,#category-filter" hx-swap="innerHTML">
  {% include "partials/item_list.html" %}
</div>

<script>
function selectCategory(slug) {
  document.getElementById('category-filter').value = slug;
  document.querySelectorAll('#category-tabs .tab').forEach(b => b.classList.toggle('active', b.dataset.slug === slug));
  htmx.trigger(document.getElementById('search-q'), 'search-now');
  refreshMissingMetaBanner();
  renderListHeader();
}

function setViewMode(mode) {
  localStorage.setItem('itemViewMode', mode);
  applyViewMode(mode);
}

function applyViewMode(mode) {
  document.getElementById('items-list').classList.toggle('grid-view', mode === 'grid');
  document.getElementById('view-list-btn').classList.toggle('active', mode !== 'grid');
  document.getElementById('view-grid-btn').classList.toggle('active', mode === 'grid');
  renderListHeader();
}

// Fields/display-names per category (primary field excluded from fields, since
// that's the item's name/title already) -- powers the "Details & Sort" picker.
// Declared before the initial applyViewMode() call below since that already
// triggers renderListHeader(), which reads CATEGORY_FIELDS.
const CATEGORY_FIELDS = {{ category_fields_json | safe }};
const CATEGORY_NAMES = {{ category_names_json | safe }};

applyViewMode(localStorage.getItem('itemViewMode') || 'list');

function slugifyField(f) {
  return f.toLowerCase().replace(/[^a-z0-9]+/g, '-');
}

function loadViewOptions(slug) {
  try {
    return JSON.parse(localStorage.getItem('viewOptions:' + slug) || '{}');
  } catch (e) {
    return {};
  }
}

function saveViewOptions(slug, opts) {
  localStorage.setItem('viewOptions:' + slug, JSON.stringify(opts));
}

function openViewOptions() {
  let slug = document.getElementById('category-filter').value;
  const configurableSlugs = Object.keys(CATEGORY_FIELDS);
  if (!configurableSlugs.includes(slug)) {
    slug = configurableSlugs[0];
    selectCategory(slug);
  }
  const fields = CATEGORY_FIELDS[slug] || [];
  const current = loadViewOptions(slug);

  const categoryPicker =
    '<label class="lookup-label">Category:</label>' +
    '<select onchange="selectCategory(this.value); openViewOptions();">' +
    configurableSlugs.map(s => '<option value="' + s + '" ' + (s === slug ? 'selected' : '') + '>' + (CATEGORY_NAMES[s] || s) + '</option>').join('') +
    '</select>';

  let body;
  if (fields.length === 0) {
    body = '<p class="lookup-hint">This category has no extra fields to show or sort by.</p>';
  } else {
    const currentFields = current.detailFields || [];
    let checkboxes = '';
    fields.forEach(f => {
      checkboxes += '<label><input type="checkbox" name="detailField" value="' + f + '" ' + (currentFields.includes(f) ? 'checked' : '') + '> ' + f + '</label>';
    });
    body =
      '<p class="lookup-label">Show as columns:</p>' +
      '<div class="view-options-list">' + checkboxes + '</div>' +
      '<p class="lookup-hint">Tip: tap a column header above the list to sort by it.</p>';
  }

  document.getElementById('modal-slot').innerHTML =
    '<div class="modal-backdrop" onclick="if (event.target === this) this.remove()">' +
      '<div class="modal-card">' +
        '<button type="button" class="modal-close" onclick="document.getElementById(\'modal-slot\').innerHTML=\'\'">✖</button>' +
        '<h3>View Options</h3>' +
        categoryPicker +
        body +
        '<div class="modal-actions">' +
          (fields.length === 0 ? '' : '<button type="button" class="btn-primary" onclick="applyViewOptionsFromModal(\'' + slug + '\')">Apply</button>') +
          '<button type="button" class="btn-plain" onclick="document.getElementById(\'modal-slot\').innerHTML=\'\'">Close</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function applyViewOptionsFromModal(slug) {
  const modal = document.getElementById('modal-slot');
  const detailFields = Array.from(modal.querySelectorAll('input[name="detailField"]:checked')).map(el => el.value);
  // Changing what's displayed resets sort back to Name -- an old sort field that's
  // no longer shown as a column would otherwise keep silently affecting order.
  saveViewOptions(slug, {detailFields: detailFields, sortField: '', sortDir: 'asc'});
  modal.innerHTML = '';
  renderListHeader();
  applyListDisplay();
}

function setSortField(slug, field) {
  const opts = loadViewOptions(slug);
  const current = opts.sortField || '';
  opts.sortDir = (current === field && opts.sortDir === 'asc') ? 'desc' : 'asc';
  opts.sortField = field;
  saveViewOptions(slug, opts);
  renderListHeader();
  applyListDisplay();
}

function makeHeaderButton(slug, field, label) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'list-header-col';
  btn.textContent = label;
  btn.addEventListener('click', () => setSortField(slug, field));
  return btn;
}

function renderListHeader() {
  const headerEl = document.getElementById('list-header');
  if (!headerEl) return;
  const mode = localStorage.getItem('itemViewMode') || 'list';
  headerEl.innerHTML = '';
  if (mode !== 'list') return;

  const slug = document.getElementById('category-filter').value;
  const opts = loadViewOptions(slug);
  const detailFields = (CATEGORY_FIELDS[slug] && opts.detailFields) || [];
  const sortField = opts.sortField || '';
  const sortDir = opts.sortDir || 'asc';
  const arrow = (field) => sortField === field ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';

  const row = document.createElement('div');
  row.className = 'item-row list-header-row';

  const thumbSpacer = document.createElement('div');
  thumbSpacer.className = 'item-thumb';
  row.appendChild(thumbSpacer);

  const main = document.createElement('div');
  main.className = 'item-main list-header-main';

  const nameCol = document.createElement('div');
  nameCol.className = 'list-header-name-col';
  nameCol.appendChild(makeHeaderButton(slug, '', 'Name' + arrow('')));
  main.appendChild(nameCol);

  const categoryCol = document.createElement('div');
  categoryCol.className = 'list-header-category-col';
  categoryCol.appendChild(makeHeaderButton(slug, '__category__', 'Category' + arrow('__category__')));
  main.appendChild(categoryCol);

  const detailCols = document.createElement('div');
  detailCols.className = 'list-header-cols';
  detailFields.forEach(f => detailCols.appendChild(makeHeaderButton(slug, f, f + arrow(f))));
  main.appendChild(detailCols);

  row.appendChild(main);

  const actionsSpacer = document.createElement('div');
  actionsSpacer.className = 'item-actions';
  row.appendChild(actionsSpacer);

  headerEl.appendChild(row);
}

function applyListDisplay() {
  const container = document.getElementById('items-list');
  if (!container) return;
  const rows = Array.from(container.querySelectorAll('.item-row'));

  rows.forEach(row => {
    const opts = loadViewOptions(row.dataset.category);
    const colsEl = row.querySelector('.item-extra-cols');
    if (!colsEl) return;
    const detailFields = opts.detailFields || [];
    colsEl.innerHTML = '';
    detailFields.forEach(f => {
      const value = row.getAttribute('data-field-' + slugifyField(f)) || '';
      const span = document.createElement('span');
      span.className = 'item-col';
      span.title = f;
      span.textContent = value;
      colsEl.appendChild(span);
    });
  });

  // Name and Category sort apply everywhere, including "All"; a custom field
  // only makes sense within its own category (different categories don't
  // share fields), but that's already enforced by what the header offers.
  const activeSlug = document.getElementById('category-filter').value;
  const opts = loadViewOptions(activeSlug);
  const dir = opts.sortDir === 'desc' ? -1 : 1;
  let compare;
  if (opts.sortField === '__category__') {
    compare = (a, b) => (a.dataset.categoryName || '').localeCompare(b.dataset.categoryName || '', undefined, {numeric: true, sensitivity: 'base'});
  } else if (opts.sortField) {
    const key = 'data-field-' + slugifyField(opts.sortField);
    compare = (a, b) => (a.getAttribute(key) || '').localeCompare(b.getAttribute(key) || '', undefined, {numeric: true, sensitivity: 'base'});
  } else {
    compare = (a, b) => (a.querySelector('.item-name').textContent || '').localeCompare(b.querySelector('.item-name').textContent || '', undefined, {numeric: true, sensitivity: 'base'});
  }
  rows.sort((a, b) => dir * compare(a, b));
  rows.forEach(r => container.appendChild(r));
  renderListHeader();
}

document.body.addEventListener('htmx:afterSwap', function (evt) {
  if (evt.detail.target && evt.detail.target.id === 'items-list') {
    applyListDisplay();
  }
});
applyListDisplay();

function searchNewItemMetadata(btn) {
  const slug = btn.dataset.slug;
  const primaryField = btn.dataset.primaryField;
  const input = document.querySelector('#dynamic-fields [name="' + primaryField + '"]');
  const q = input ? input.value.trim() : '';
  const results = document.getElementById('new-item-search-results');
  if (!q) {
    if (results) results.innerHTML = '<p class="empty">Type a ' + primaryField + ' above first.</p>';
    return;
  }
  const path = slug === 'movies' ? 'omdb' : slug === 'games' ? 'bgg' : slug === 'video-games' ? 'rawg' : 'web-images';
  htmx.ajax('GET', '/items/new/lookup/' + path + '?q=' + encodeURIComponent(q), {target: '#new-item-search-results', swap: 'innerHTML'});
}

function fillAddForm(el) {
  fillAddFormFromData(JSON.parse(el.dataset.match));
}

// Edit drawer: after a search, fill in whatever fields are still blank using
// the best available result -- never overwrites a value that's already there
// -- and mark each one it touched with a ✨ next to its label so it's obvious
// which values came from search versus what was already on the item. The
// mark clears the moment the field is edited by hand.
// "Type" is deliberately excluded from counting as real metadata on its own --
// a bare TMDb "Collection" hit (title + poster + Type, nothing else) would
// otherwise look just as good as an actual movie with a real Rating/Genre/etc.
const AUTO_FILL_IGNORED_KEYS = new Set(["Title", "image_path", "match_json", "id", "Type"]);

function autoFillFromSearch(itemId) {
  const results = document.getElementById('lookup-results-' + itemId);
  const form = document.getElementById('item-' + itemId);
  if (!results || !form) return;

  // The literal first candidate is sometimes a bare title+poster hit (e.g. a
  // TMDb "Collection" entry, which precedes real movie matches) with nothing
  // else to offer -- prefer the first one that actually carries real fields.
  const candidates = Array.from(results.querySelectorAll('.lookup-card [data-match]'));
  let data = null;
  for (const btn of candidates) {
    let parsed;
    try {
      parsed = JSON.parse(btn.dataset.match);
    } catch (e) {
      continue;
    }
    const hasRealMetadata = Object.keys(parsed).some(k => !AUTO_FILL_IGNORED_KEYS.has(k) && parsed[k]);
    if (hasRealMetadata) {
      data = parsed;
      break;
    }
    if (!data) data = parsed;
  }
  if (!data) return;

  Object.entries(data).forEach(([key, value]) => {
    if (key === 'match_json' || !value) return;
    const selector = key === 'image_path' ? '[name="image_url"]' : '[name="' + key + '"]';
    const input = form.querySelector(selector);
    if (input && !input.value.trim()) {
      input.value = value;
      markFieldAutoFilled(input);
    }
  });
}

function markFieldAutoFilled(input) {
  input.classList.add('auto-filled');
  const label = input.previousElementSibling;
  if (label && label.tagName === 'LABEL' && !label.querySelector('.auto-fill-marker')) {
    const marker = document.createElement('span');
    marker.className = 'auto-fill-marker';
    marker.title = 'Filled in from search';
    marker.textContent = ' ✨';
    label.appendChild(marker);
  }
  const clear = () => {
    input.classList.remove('auto-filled');
    if (label) {
      const m = label.querySelector('.auto-fill-marker');
      if (m) m.remove();
    }
    input.removeEventListener('input', clear);
  };
  input.addEventListener('input', clear);
}

function fillAddFormFromData(data) {
  const container = document.getElementById('add-item-slot');
  if (!container) return;
  Object.entries(data).forEach(([key, value]) => {
    if (key === 'match_json') return;
    if (key === 'image_path') {
      const urlInput = container.querySelector('input[name="image_url"]');
      if (urlInput) urlInput.value = value;
      return;
    }
    const input = container.querySelector('[name="' + key + '"]');
    if (input) input.value = value;
  });
  const results = document.getElementById('new-item-search-results');
  if (results) results.innerHTML = '';
}

// Mirrors the BGG confirm modal (bgg_confirm_modal.html) for OMDb/TMDb/web-image
// results -- those already carry every field up front in match_json (no second
// server round-trip needed like BGG's search-then-detail-fetch), so this builds
// the same image/details/description confirm popup entirely client-side.
const METADATA_MODAL_DETAIL_FIELDS = ["Rating", "Year Released", "Length of Movie", "Genre", "Type"];

function openMetadataConfirmModal(el) {
  const data = JSON.parse(el.dataset.match);
  const mode = el.dataset.mode;
  const modal = document.getElementById('modal-slot');
  modal.innerHTML = '';

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) modal.innerHTML = ''; });

  const card = document.createElement('div');
  card.className = 'modal-card';
  backdrop.appendChild(card);

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'modal-close';
  closeBtn.textContent = '✖';
  closeBtn.addEventListener('click', () => { modal.innerHTML = ''; });
  card.appendChild(closeBtn);

  if (data.image_path) {
    const img = document.createElement('img');
    img.src = data.image_path;
    img.className = 'modal-cover';
    img.alt = '';
    card.appendChild(img);
  }

  const h3 = document.createElement('h3');
  h3.textContent = data.Title || '';
  card.appendChild(h3);

  const ul = document.createElement('ul');
  ul.className = 'modal-details';
  METADATA_MODAL_DETAIL_FIELDS.forEach(field => {
    if (!data[field]) return;
    const li = document.createElement('li');
    const strong = document.createElement('strong');
    strong.textContent = field + ': ';
    li.appendChild(strong);
    li.appendChild(document.createTextNode(data[field]));
    ul.appendChild(li);
  });
  card.appendChild(ul);

  if (data.Description) {
    const p = document.createElement('p');
    p.className = 'modal-description';
    p.textContent = data.Description;
    card.appendChild(p);
  }

  const actions = document.createElement('div');
  actions.className = 'modal-actions';

  const applyBtn = document.createElement('button');
  applyBtn.type = 'button';
  applyBtn.className = 'btn-primary';
  applyBtn.textContent = '✅ Apply';
  applyBtn.addEventListener('click', () => {
    if (mode === 'new') {
      fillAddFormFromData(data);
    } else {
      const values = Object.assign({}, data);
      delete values.match_json;
      const panel = el.dataset.panel;
      if (panel) values.panel = panel;
      htmx.ajax('POST', '/items/' + el.dataset.itemId + '/apply-metadata', {
        target: '#' + el.dataset.targetId,
        swap: 'outerHTML',
        values: values,
      });
    }
    modal.innerHTML = '';
  });
  actions.appendChild(applyBtn);

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.className = 'btn-plain';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', () => { modal.innerHTML = ''; });
  actions.appendChild(cancelBtn);

  card.appendChild(actions);
  modal.appendChild(backdrop);
}

function refreshMissingMetaBanner() {
  const slug = document.getElementById('category-filter').value;
  htmx.ajax('GET', '/categories/' + slug + '/missing-metadata', {target: '#missing-metadata-banner', swap: 'innerHTML'});
}
document.body.addEventListener('refreshList', refreshMissingMetaBanner);
document.body.addEventListener('refreshMissingMeta', refreshMissingMetaBanner);
refreshMissingMetaBanner();
</script>
{% endblock %}
