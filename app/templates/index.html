{% extends "base.html" %}
{% block content %}
<div id="toolbar">
  <div class="toolbar-row">
    <h2>🏠 Home Inventory</h2>
    <form action="/logout" method="post" class="logout-form"><button class="btn-plain">🚪 Log Out</button></form>
  </div>

  <input type="search" id="search-q" name="q" placeholder="🔍 Search inventory..."
         hx-get="/items" hx-target="#items-list" hx-swap="innerHTML"
         hx-trigger="keyup changed delay:300ms, search-now" hx-include="#category-filter">
  <input type="hidden" id="category-filter" name="category" value="all">

  {% include "partials/category_tabs.html" %}
  <div id="category-form-slot"></div>

  <div id="missing-metadata-banner"></div>
  <div id="missing-metadata-panel-slot"></div>

  <button class="btn-primary" hx-get="/items/new" hx-target="#add-item-slot" hx-swap="innerHTML">➕ Add Item</button>
  <div id="add-item-slot"></div>

  <div class="view-toggle">
    <button type="button" id="view-list-btn" class="btn-plain" onclick="setViewMode('list')">☰ Details</button>
    <button type="button" id="view-grid-btn" class="btn-plain" onclick="setViewMode('grid')">🔳 Icons</button>
  </div>
</div>

<div id="items-list" hx-trigger="refreshList from:body" hx-get="/items" hx-include="#search-q,#category-filter" hx-swap="innerHTML">
  {% include "partials/item_list.html" %}
</div>

<script>
function selectCategory(slug, btn) {
  document.getElementById('category-filter').value = slug;
  document.querySelectorAll('#category-tabs .tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  htmx.trigger(document.getElementById('search-q'), 'search-now');
  refreshMissingMetaBanner();
}

function setViewMode(mode) {
  localStorage.setItem('itemViewMode', mode);
  applyViewMode(mode);
}

function applyViewMode(mode) {
  document.getElementById('items-list').classList.toggle('grid-view', mode === 'grid');
  document.getElementById('view-list-btn').classList.toggle('active', mode !== 'grid');
  document.getElementById('view-grid-btn').classList.toggle('active', mode === 'grid');
}

applyViewMode(localStorage.getItem('itemViewMode') || 'list');

function refreshMissingMetaBanner() {
  const slug = document.getElementById('category-filter').value;
  htmx.ajax('GET', '/categories/' + slug + '/missing-metadata', {target: '#missing-metadata-banner', swap: 'innerHTML'});
}
document.body.addEventListener('refreshList', refreshMissingMetaBanner);
document.body.addEventListener('refreshMissingMeta', refreshMissingMetaBanner);
refreshMissingMetaBanner();
</script>
{% endblock %}
